<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact page for Sprint Global Org portfolio." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!--
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://formsubmit.co; img-src 'self' data:; style-src 'self'; font-src 'self' data:; connect-src 'none'; frame-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'none'; script-src 'self'; upgrade-insecure-requests; block-all-mixed-content" />
  -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), web-share=(), xr-spatial-tracking=()" />
  <title>Contact | Sprint Global Org</title>
  <link rel="stylesheet" href="styles.css?v=20260731" />
</head>
<body>
  <nav>
    <div class="container nav-row">
      <a class="brand-link" href="index.html#top" aria-label="Go to homepage top">
        <img class="brand-logo" src="assets/Sprint_Global_Devs_Logo_White.png" alt="Sprint Global Devs logo" />
        <span class="brand-name">Reginald <span class="brand-accent">Ofori</span></span>
      </a>
      <div class="links">
        <a href="index.html#about-me">About Me</a>
        <a href="index.html#projects">Projects</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section id="contact">
      <h2>Contact</h2>
      <p class="contact-intro">
        Fill out the form below and your message will be sent directly.
      </p>

      <form class="contact-form" action="https://formsubmit.co/reginaldoforidevs@gmail.com" method="POST" accept-charset="UTF-8">
        <input type="hidden" name="_subject" value="New message from portfolio" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="text" name="_honey" class="bot-field" tabindex="-1" autocomplete="off" aria-hidden="true" />

        <div class="form-grid">
          <label class="form-field">
            <span>First Name</span>
            <input type="text" name="name" required maxlength="40" placeholder="First name" />
          </label>

          <label class="form-field">
            <span>Last Name</span>
            <input type="text" name="last_name" required maxlength="40" placeholder="Last name" />
          </label>

          <label class="form-field">
            <span>Email</span>
            <input type="email" name="email" required maxlength="120" placeholder="you@email.com" />
          </label>

          <label class="form-field">
            <span>Phone</span>
            <input type="tel" name="phone" maxlength="30" placeholder="(469) 401-2097" />
          </label>
        </div>

        <label class="form-field form-field-full">
          <span>Message</span>
          <textarea name="message" required maxlength="2000" rows="6" placeholder="Tell me about the role or project."></textarea>
        </label>

        <div class="contact-actions">
          <button class="contact-submit" type="submit">Send Message</button>
          <button class="contact-cancel" type="reset">Cancel</button>
        </div>
      </form>

      <div class="contact-fallback" role="note" aria-label="Fallback contact methods">
        <h3>Fallback Contact</h3>
        <p>If the form does not submit for any reason, contact me directly:</p>
        <div class="contact-links">
          <button class="contact-copy" id="copy-email-btn" type="button" data-email-user="reginaldoforidevs" data-email-domain="gmail.com">Copy Email Address</button>
          <a href="tel:+14694012097">(469) 401-2097</a>
          <a href="https://www.linkedin.com/in/reginaldhkofori" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>
        <p class="copy-feedback" id="copy-feedback" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer>
    © 2026 Sprint Global Org. Portfolio summary profile.
  </footer>
  <script src="contact.js" defer></script>
</body>
</html>
